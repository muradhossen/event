  <form #form="ngForm" (ngSubmit)="submitImage()" autocomplete="off">

      <div class="col-sm-3 my-1">

            {{city.name}}
          </option>

        <select class="form-control" id="exampleFormControlSelect1"
        name="city"
         [(ngModel)]="userPhotoParams.id"
        >
          <option value="0" disabled>Select the district where the picture was taken</option>
          <option *ngFor="let city of cities" [value]="city.id">
            {{city.name}}            
          </option>
        </select>
        
      </div>
      <div class="col-sm-3 my-1">
        <label class="sr-only" for="inlineFormInputGroupUsername">Username</label>
        <div class="input-group"> 
          <input type="file" name="image" id="file-upload" class="form-control" id="inlineFormInputGroupUsername" placeholder="Select image" #fileInput (change)="onFileSelected($event)">
        </div>
      </div>
  
      <div class="col-auto my-1">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </div>
  </form>
