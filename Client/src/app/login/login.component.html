<form *ngIf="(accountServic.currentUser$ | async)===null" #loginForm="ngForm" (ngSubmit)="login()" autocomplete="off">
  <div class="form-group">
    <label for="exampleInputEmail1">Username</label>
    <input name="username" [(ngModel)]="model.username" class="form-control" id="exampleInputEmail1"
      aria-describedby="emailHelp" type="text" placeholder="Username">
  </div>
  <div class="form-group">
    <label for="exampleInputPassword1">Password</label>
    <input name="password" [(ngModel)]="model.password" type="password" class="form-control" id="exampleInputPassword1"
      placeholder="Password">
  </div>

  <button type="submit" class="btn btn-primary">Login</button>
</form>
<div class="dropdown" *ngIf="(accountServic.currentUser$ | async) as user" dropdown>
  <button class="btn btn-primary btn-lg btn-block" (click)="logout()"> Logout </button>
  <button class="btn btn-secondary btn-lg btn-block" [routerLink]="'/'"> Go to Dashboard </button>
</div>
